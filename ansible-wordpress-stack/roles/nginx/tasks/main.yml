---
- name: install nginx
  apt:
    name: nginx
    state: present
    update_cache: yes

- name: start nginx
  service:
    name: nginx
    state: started
    enabled: yes

- name: copy nginx config
  template:
    src: wordpress.conf.j2
    dest: /etc/nginx/sites-available/wordpress
    mode: "0644"
  notify: reload nginx

- name: enable site
  file:
    src: /etc/nginx/sites-available/wordpress
    dest: /etc/nginx/sites-enabled/wordpress
    state: link
  notify: reload nginx

# دیفالت nginx رو برداریم
- name: remove default site
  file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: reload nginx
